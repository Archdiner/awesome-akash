version: "2.0"

endpoints:
  metal_endpoint:
    kind: ip

services:
  metal-blockchain:
    image: ubuntu:22.04
    env:
      # After initial deployment, update this with YOUR IP from Akash Console
      # Get IP and port from: Akash Console → Leases tab
      # Example format: METAL_PUBLIC_IP=http://YOUR-IP-HERE:9650
      - METAL_PUBLIC_IP=
    command:
      - /bin/bash
      - -c
      - 'curl -s https://raw.githubusercontent.com/akash-network/awesome-akash/master/metal-validator/main.sh | bash'
    
    expose:
      - port: 9650
        as: 9650
        to:
          - global: true
            ip: metal_endpoint
        proto: tcp
      - port: 9651  
        as: 9651
        to:
          - global: true
            ip: metal_endpoint
        proto: tcp

profiles:
  compute:
    metal-blockchain:
      resources:
        cpu:
          units: 2.0
        memory:
          size: 4Gi
        storage:
          - size: 120Gi

  placement:
    akash-providers:
      attributes:
        host: akash
        ip-lease: true
      pricing:
        metal-blockchain:
          denom: uact
          amount: 120

deployment:
  metal-blockchain:
    akash-providers:
      profile: metal-blockchain
      count: 1
